appId: host.exp.exponent
name: Expo Go - Today screenshot
---
# An explicit route also works on retries: Expo Go can ignore the already-open root URL.
- openLink: "${EXPO_URL}/--/habits"
- runFlow: dismiss-expo.yaml
- extendedWaitUntil:
      visible: "Rename, reorder, set polarity, or add"
      timeout: 30000
- tapOn: "Today"
- extendedWaitUntil:
      visible: "logged today"
      timeout: 60000
- extendedWaitUntil:
      visible: "Read 20 min"
      timeout: 30000
# The fixture has four successes and a six-day reading streak on September 9.
# These checks wait for entries and streaks, not just the habit list or header.
- extendedWaitUntil:
      visible: "4 of 6 habits logged"
      timeout: 30000
- extendedWaitUntil:
      visible: ".*6 days.*"
      timeout: 30000
- assertVisible: "logged today"
- assertVisible: "4 of 6 habits logged"
- takeScreenshot: android-today
