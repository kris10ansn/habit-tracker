appId: host.exp.exponent
name: Expo Go - App screenshots
---
- runFlow:
      file: today.yaml
      env:
          EXPO_URL: ${EXPO_URL}

- openLink: "${EXPO_URL}/--/habits"
- extendedWaitUntil:
      visible: "Rename, reorder, set polarity, or add"
      timeout: 30000
- extendedWaitUntil:
      visible: "Read 20 min"
      timeout: 30000
- assertVisible: "Rename, reorder, set polarity, or add"
- takeScreenshot: android-habits

- openLink: "${EXPO_URL}/--/month"
- extendedWaitUntil:
      visible: "Your habits across the month"
      timeout: 30000
- extendedWaitUntil:
      visible: "R2m.*"
      timeout: 30000
- assertVisible: "Your habits across the month"
- takeScreenshot: android-month

- openLink: "${EXPO_URL}/--/sync"
- extendedWaitUntil:
      visible: "Keep every device in step"
      timeout: 30000
- extendedWaitUntil:
      visible: "Changes not synced"
      timeout: 30000
- assertVisible: "Changes not synced"
- takeScreenshot: android-sync

- openLink: "${EXPO_URL}/--/devices"
- extendedWaitUntil:
      visible: "Every device signed into your account"
      timeout: 30000
- extendedWaitUntil:
      visible: "Pixel 9a"
      timeout: 30000
- extendedWaitUntil:
      visible: "reMarkable 1"
      timeout: 30000
- assertVisible: "Every device signed into your account"
- assertVisible: "Pixel 9a"
- assertVisible: "reMarkable 1"
- takeScreenshot: android-devices

- openLink: "${EXPO_URL}/--/link-device"
- extendedWaitUntil:
      visible: "Scan the QR code or enter the 6-character code"
      timeout: 30000
- extendedWaitUntil:
      visible: "H7K9Q2"
      timeout: 30000
- extendedWaitUntil:
      visible: "Requesting device: reMarkable 1"
      timeout: 30000
- extendedWaitUntil:
      visible: "Approve"
      timeout: 30000
- assertVisible: "Requesting device: reMarkable 1"
- takeScreenshot: android-pairing
