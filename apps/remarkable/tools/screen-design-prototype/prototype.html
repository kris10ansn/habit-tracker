<!-- Throwaway: three landscape idle-screen designs, preserving the README's X-only public-habit snapshot. -->
<style>
    #remarkable-screen-ideas {
        position: relative;
        padding-bottom: 82px;
    }
    #remarkable-screen-ideas .screen-preview {
        background: #fff;
        color: #111;
        aspect-ratio: 4 / 3;
        width: 100%;
    }
    #remarkable-screen-ideas .screen-preview svg {
        display: block;
        width: 100%;
        height: 100%;
    }
    #remarkable-screen-ideas .prototype-controls {
        position: sticky;
        bottom: 12px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 16px auto -66px;
        width: fit-content;
        max-width: 100%;
    }
    #remarkable-screen-ideas .prototype-controls select {
        max-width: 185px;
    }
    #remarkable-screen-ideas .screen-description {
        font: 12px sans-serif;
        margin: 0 0 8px;
    }
</style>
<div
    id="remarkable-screen-ideas"
    aria-label="reMarkable idle-screen design exploration"
>
    <div class="screen-description" aria-live="polite"></div>
    <div class="screen-preview" aria-label="Tablet screen mockup"></div>
    <div
        class="prototype-controls"
        aria-label="Prototype controls, outside tablet screen"
    >
        <button
            class="btn"
            type="button"
            data-step="-1"
            aria-label="Previous design"
        >
            ←
        </button>
        <select
            class="form-select"
            aria-label="Design concept"
            id="screen-concept"
        >
            <option value="A">A · Quiet ledger</option>
            <option value="B">B · Open notebook</option>
            <option value="C">C · State panel</option>
        </select>
        <button
            class="btn"
            type="button"
            data-step="1"
            aria-label="Next design"
        >
            →
        </button>
        <select class="form-select" aria-label="Tablet state" id="screen-state">
            <option value="sleep">Sleeping</option>
            <option value="off">Powered off</option>
            <option value="empty">Battery empty</option>
        </select>
    </div>
</div>
<script>
    (() => {
        const root = document.getElementById("remarkable-screen-ideas");
        const preview = root.querySelector(".screen-preview");
        const conceptSelect = root.querySelector("#screen-concept");
        const stateSelect = root.querySelector("#screen-state");
        const query = new URLSearchParams(location.search);
        const settings = {
            variant: ["A", "B", "C"].includes(query.get("variant"))
                ? query.get("variant")
                : "A",
            deviceState: ["sleep", "off", "empty"].includes(query.get("state"))
                ? query.get("state")
                : "sleep",
            serif: true,
        };
        // Public marks transcribed from the README screenshot; no O marks are added.
        const habits = [
            { name: "Read 20 min", days: [1, 2, 4, 5, 6, 7, 8, 9] },
            { name: "Exercise", days: [1, 4, 6, 8] },
            { name: "Journal", days: [1, 2, 3, 7, 9] },
            { name: "Stretch", days: [2, 3, 4, 5, 7, 8, 9] },
            { name: "No sweets", days: [1, 3, 4, 5, 7, 8] },
        ];
        const states = {
            sleep: {
                label: "Sleeping",
                action: "Press power to wake",
                short: "SLEEPING",
            },
            off: {
                label: "Powered off",
                action: "Hold power to turn on",
                short: "POWERED OFF",
            },
            empty: {
                label: "Battery empty",
                action: "Connect to power",
                short: "BATTERY EMPTY",
            },
        };
        const names = {
            A: "Quiet ledger",
            B: "Open notebook",
            C: "State panel",
        };
        const escape = (value) =>
            String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/"/g, "&quot;");
        const text = (x, y, value, size = 28, extra = "") =>
            `<text x="${x}" y="${y}" font-size="${size}" ${extra}>${escape(value)}</text>`;
        const line = (x1, y1, x2, y2, stroke = "#777", width = 1.6) =>
            `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${width}"/>`;
        const rect = (x, y, width, height, fill, extra = "") =>
            `<rect x="${x}" y="${y}" width="${width}" height="${height}" fill="${fill}" ${extra}/>`;
        const editorial = () =>
            settings.serif
                ? 'font-family="Georgia, serif"'
                : 'font-family="Arial, sans-serif"';
        const overline = (x, y, value, extra = "") =>
            text(x, y, value, 23, `letter-spacing="4" ${extra}`);
        const mark = (x, y, size = 12) =>
            `<path d="M${x - size},${y - size} l${size * 2},${size * 2} M${x - size},${y + size} l${size * 2},-${size * 2}" fill="none" stroke="#111" stroke-width="3.4" stroke-linecap="round"/>`;

        function monthGrid({
            x,
            y,
            width,
            labelWidth,
            first = 1,
            last = 30,
            rowHeight = 110,
            size = 29,
        }) {
            const dayWidth = (width - labelWidth) / (last - first + 1);
            const gridX = x + labelWidth;
            const bodyTop = y + 48;
            const bottom = bodyTop + rowHeight * habits.length;
            const pieces = [];
            if (first <= 9 && last >= 9) {
                const currentX = gridX + (9 - first) * dayWidth;
                pieces.push(
                    rect(currentX, y + 5, dayWidth, bottom - y - 5, "#eee"),
                );
                pieces.push(
                    rect(currentX + 2, y - 30, dayWidth - 4, 47, "#111"),
                );
            }
            for (let day = first; day <= last; day++) {
                const center = gridX + (day - first + 0.5) * dayWidth;
                pieces.push(
                    text(
                        center,
                        y + 3,
                        day,
                        size,
                        `text-anchor="middle" fill="${day === 9 ? "#fff" : "#333"}"`,
                    ),
                );
                if (day % 5 === 0 && day !== last)
                    pieces.push(
                        line(
                            center + dayWidth / 2,
                            bodyTop,
                            center + dayWidth / 2,
                            bottom,
                            "#aaa",
                            1.4,
                        ),
                    );
            }
            pieces.push(line(x, bodyTop, x + width, bodyTop, "#111", 2));
            habits.forEach((habit, row) => {
                const centerY = bodyTop + (row + 0.5) * rowHeight;
                pieces.push(text(x, centerY + 11, habit.name, 33));
                for (let day = first; day <= last; day++) {
                    const centerX = gridX + (day - first + 0.5) * dayWidth;
                    if (habit.days.includes(day))
                        pieces.push(
                            mark(
                                centerX,
                                centerY,
                                Math.min(13, dayWidth * 0.22),
                            ),
                        );
                }
                pieces.push(
                    line(
                        x,
                        bodyTop + (row + 1) * rowHeight,
                        x + width,
                        bodyTop + (row + 1) * rowHeight,
                    ),
                );
            });
            return pieces.join("");
        }

        function statusFooter(y) {
            const current = states[settings.deviceState];
            const pieces = [line(96, y - 55, 1776, y - 55, "#111", 2)];
            if (settings.deviceState === "empty") {
                pieces.push(rect(96, y - 15, 310, 56, "#111"));
                pieces.push(
                    text(
                        120,
                        y + 24,
                        current.short,
                        26,
                        'fill="#fff" font-weight="700" letter-spacing="2"',
                    ),
                );
            } else {
                pieces.push(
                    text(96, y + 26, current.label, 42, 'font-weight="600"'),
                );
            }
            pieces.push(
                text(1776, y + 24, current.action, 29, 'text-anchor="end"'),
            );
            pieces.push(
                text(
                    96,
                    y + 105,
                    "Snapshot · 9 September 2026",
                    25,
                    'fill="#444"',
                ),
            );
            pieces.push(
                text(
                    1776,
                    y + 105,
                    "Habit tracker",
                    25,
                    'text-anchor="end" fill="#444"',
                ),
            );
            return pieces.join("");
        }

        function VariantA() {
            return [
                overline(96, 110, "HABIT TRACKER"),
                text(90, 232, "September", 112, editorial()),
                text(1776, 223, "2026", 57, `text-anchor="end" ${editorial()}`),
                text(96, 296, "30 days", 28, 'fill="#444"'),
                text(
                    1776,
                    296,
                    "9 · Snapshot day",
                    28,
                    'text-anchor="end" fill="#444"',
                ),
                monthGrid({
                    x: 96,
                    y: 407,
                    width: 1680,
                    labelWidth: 315,
                    rowHeight: 112,
                }),
                statusFooter(1140),
            ].join("");
        }

        function VariantB() {
            const current = states[settings.deviceState];
            return [
                overline(96, 98, "HABIT TRACKER"),
                text(91, 187, "September 2026", 72, editorial()),
                text(
                    1776,
                    103,
                    current.label,
                    42,
                    'text-anchor="end" font-weight="700"',
                ),
                text(1776, 153, current.action, 27, 'text-anchor="end"'),
                line(96, 241, 1776, 241, "#111", 2),
                overline(96, 310, "01—15"),
                monthGrid({
                    x: 96,
                    y: 374,
                    width: 1680,
                    labelWidth: 330,
                    first: 1,
                    last: 15,
                    rowHeight: 66,
                    size: 30,
                }),
                overline(96, 845, "16—30"),
                monthGrid({
                    x: 96,
                    y: 909,
                    width: 1680,
                    labelWidth: 330,
                    first: 16,
                    last: 30,
                    rowHeight: 66,
                    size: 30,
                }),
                text(
                    96,
                    1350,
                    "Snapshot · 9 September 2026",
                    25,
                    'fill="#444"',
                ),
                text(
                    1776,
                    1350,
                    "30 days · shaded column = snapshot day",
                    25,
                    'text-anchor="end" fill="#444"',
                ),
            ].join("");
        }

        function VariantC() {
            const current = states[settings.deviceState];
            const pieces = [
                line(482, 96, 482, 1308, "#111", 2),
                overline(80, 120, "REMARKABLE"),
                overline(558, 120, "HABIT TRACKER"),
                text(552, 216, "September 2026", 77, editorial()),
                text(
                    1776,
                    278,
                    "30 days · snapshot day 9",
                    26,
                    'text-anchor="end" fill="#444"',
                ),
                text(80, 1260, "Snapshot", 25, 'fill="#444"'),
                text(80, 1308, "9 September 2026", 29),
            ];
            const labelLines = {
                sleep: ["Sleeping"],
                off: ["Powered", "off"],
                empty: ["Battery", "empty"],
            }[settings.deviceState];
            labelLines.forEach((label, index) =>
                pieces.push(text(75, 595 + index * 82, label, 70, editorial())),
            );
            pieces.push(
                line(
                    80,
                    743,
                    174,
                    743,
                    "#111",
                    settings.deviceState === "empty" ? 10 : 3,
                ),
            );
            const actionLines = {
                sleep: ["Press power", "to wake"],
                off: ["Hold power", "to turn on"],
                empty: ["Connect", "to power"],
            }[settings.deviceState];
            actionLines.forEach((label, index) =>
                pieces.push(text(80, 808 + index * 42, label, 30)),
            );
            habits.forEach((habit, row) => {
                const top = 364 + row * 184;
                const dayWidth = 1218 / 30;
                pieces.push(
                    text(558, top, habit.name, 36, 'font-weight="500"'),
                );
                pieces.push(line(558, top + 124, 1776, top + 124));
                for (let day = 1; day <= 30; day++) {
                    const center = 558 + (day - 0.5) * dayWidth;
                    if (day === 9)
                        pieces.push(
                            rect(center - 18, top + 24, 36, 83, "#eee"),
                        );
                    pieces.push(
                        text(
                            center,
                            top + 52,
                            day,
                            24,
                            `text-anchor="middle" ${day === 9 ? 'font-weight="700"' : 'fill="#444"'}`,
                        ),
                    );
                    if (habit.days.includes(day))
                        pieces.push(mark(center, top + 88, 10));
                }
            });
            return pieces.join("");
        }

        function render() {
            const variants = { A: VariantA, B: VariantB, C: VariantC };
            preview.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1872 1404" role="img" aria-label="${escape(names[settings.variant])}, ${escape(states[settings.deviceState].label)}. September 2026, five public habits, 30 days. Saved snapshot from September 9." font-family="Arial, sans-serif" fill="#111"><title>${escape(names[settings.variant])} · ${escape(states[settings.deviceState].label)}</title><rect width="1872" height="1404" fill="#fff"/>${variants[settings.variant]()}</svg>`;
            conceptSelect.value = settings.variant;
            stateSelect.value = settings.deviceState;
            root.querySelector(".screen-description").textContent =
                `${settings.variant} · ${names[settings.variant]} / ${states[settings.deviceState].label} · README sample, 9 Sep 2026`;
        }

        function updateUrl() {
            if (
                !["http:", "https:", "file:"].includes(location.protocol) ||
                location.href === "about:srcdoc"
            )
                return;
            const url = new URL(location.href);
            url.searchParams.set("variant", settings.variant);
            url.searchParams.set("state", settings.deviceState);
            try {
                history.replaceState(null, "", url);
            } catch (_) {
                /* Sandboxed inline previews have an opaque origin. */
            }
        }

        function step(direction) {
            const variants = ["A", "B", "C"];
            settings.variant =
                variants[
                    (variants.indexOf(settings.variant) + direction + 3) % 3
                ];
            render();
            updateUrl();
        }

        conceptSelect.addEventListener("change", () => {
            settings.variant = conceptSelect.value;
            render();
            updateUrl();
        });
        stateSelect.addEventListener("change", () => {
            settings.deviceState = stateSelect.value;
            render();
            updateUrl();
        });
        root.querySelectorAll("[data-step]").forEach((button) =>
            button.addEventListener("click", () =>
                step(Number(button.dataset.step)),
            ),
        );
        document.addEventListener("keydown", (event) => {
            if (
                event.target.closest(
                    "input, textarea, select, [contenteditable]",
                )
            )
                return;
            if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
            event.preventDefault();
            step(event.key === "ArrowRight" ? 1 : -1);
        });
        render();
        if (globalThis.Tweak) {
            const tweak = new Tweak({ container: preview, onChange: render });
            tweak.addToggle(settings, "serif", { label: "Serif headline" });
        }
    })();
</script>
